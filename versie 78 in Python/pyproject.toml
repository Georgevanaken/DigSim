[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digsim-py"
version = "0.1.0"
description = "Python port of DigSim v78, a simulator of human digestion and absorption (G. van Aken)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
digsim = "digsim.digsim_v78:cli"

[tool.setuptools]
packages = ["digsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Verbatim scalar copies of the original code (Pascal-style "for st.i in range(...)" loops).
"tests/ref_*.py" = ["B020"]
